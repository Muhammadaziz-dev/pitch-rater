services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      CELERY_REDIS_URL: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
      # If you use Google Speech-to-Text inside Docker, mount your key and set this path:
      # GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-sa.json
    env_file:
      - .env
    depends_on:
      - redis
    volumes:
      - .:/app
      -  /opt/credentials/service-account.json:/app/credentials/gcp.json:ro
  worker:
    build: .
    command: >
      celery -A jobs.celery_app.celery_app worker
      -P threads -c 4 -l info
      --without-gossip --without-mingle --without-heartbeat
    restart: unless-stopped
    environment:
      CELERY_REDIS_URL: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
      # GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-sa.json
    env_file:
      - .env
    depends_on:
      - redis
    volumes:
      - .:/app
      -  /opt/credentials/service-account.json:/app/credentials/gcp.json:ro


  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/nginx/www:/var/www/certbot:ro
      - ./deploy/nginx/certs:/etc/letsencrypt:ro
    depends_on:
      - api

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./deploy/nginx/www:/var/www/certbot
      - ./deploy/nginx/certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
